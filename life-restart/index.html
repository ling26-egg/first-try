<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生重开模拟器 · 多元宇宙版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-char" aria-hidden="true">命</div>

  <main class="stage">
    <!-- 屏幕1：封面 -->
    <section class="screen active" id="screen-start">
      <div class="bureau">轮 回 管 理 局 · 万 界 分 局</div>
      <div class="title-row">
        <h1 class="title">人生<span class="red">重开</span></h1>
        <div class="seal title-seal">命</div>
      </div>
      <p class="subtitle">此生不得志？饮罢孟婆汤，五界任你投。</p>
      <div class="divider"></div>
      <div class="reinc-stat">
        <div><b id="stat-runs">0</b>累计转世</div>
        <div><b id="stat-last">——</b>上世结局</div>
      </div>
      <button class="btn btn-primary" id="btn-start">踏 入 轮 回</button>
      <div class="foot">多元宇宙版 · 修仙 / 异界 / 蛮荒 / 蛊真界</div>
    </section>

    <!-- 屏幕2：世界揭晓 -->
    <section class="screen" id="screen-world">
      <div class="bureau">投 胎 目 的 地 已 锁 定</div>
      <div class="seal world-seal" id="world-seal">界</div>
      <h2 class="world-name" id="world-name">？？</h2>
      <div class="world-rate">出现率 <b id="world-rate">--</b></div>
      <p class="world-desc" id="world-desc"></p>
      <button class="btn btn-primary" id="btn-world-go">启 程</button>
    </section>

    <!-- 屏幕3：抽天赋 -->
    <section class="screen" id="screen-talent">
      <div class="sec-head">
        <div class="sec-title">摇签 · <em>天赋</em></div>
        <div class="sec-tip" id="talent-world">十签取三</div>
      </div>
      <div class="tgrid" id="tgrid"></div>
      <button class="btn btn-primary" id="btn-confirm-talent" disabled>落 入 凡 尘</button>
      <div class="picked-count">已选 <b id="pick-n">0</b> / 3 签</div>
    </section>

    <!-- 屏幕4：分配属性（含奇异天赋揭示） -->
    <section class="screen" id="screen-alloc">
      <div class="strange-box" id="strange-box" style="display:none"></div>
      <div class="sec-head">
        <div class="sec-title">命格 · <em>初定</em></div>
        <div class="sec-tip">自由分配 25 点</div>
      </div>
      <div id="alloc-list"></div>
      <div class="remain"><span>剩余点数</span><b id="remain">25</b></div>
      <button class="btn btn-primary" id="btn-born">投 胎 转 世</button>
    </section>

    <!-- 屏幕5：人生（选择式） -->
    <section class="screen" id="screen-life">
      <div class="hud">
        <div class="hud-top">
          <span class="hud-world" id="hud-world">普通世界</span>
          <span class="hud-age">阳寿 <b id="hud-age">0</b> 岁</span>
        </div>
        <div class="hud-stats" id="hud-stats"></div>
      </div>
      <div class="choice-panel" id="choice-panel"></div>
      <div class="timeline" id="timeline"></div>
      <button class="btn" id="btn-pause">暂 停</button>
    </section>

    <!-- 屏幕6：结局 -->
    <section class="screen" id="screen-end">
      <div class="end-cause">终 · <span id="end-cause">寿终正寝</span></div>
      <div class="end-age"><span id="end-age">0</span> 岁</div>
      <div class="seal grade-seal" id="grade-seal">S</div>
      <div class="end-quote" id="end-quote"></div>
      <div class="badge-chips" id="badge-chips"></div>
      <div class="end-btns">
        <button class="btn btn-primary" id="btn-again">再 入 轮 回</button>
        <button class="btn" id="btn-home">返回封面</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="world-normal.js"></script>
  <script src="world-cultivation.js"></script>
  <script src="world-strange.js"></script>
  <script src="world-primal.js"></script>
  <script src="world-gu.js"></script>
  <script src="game.js"></script>
</body>
</html>
